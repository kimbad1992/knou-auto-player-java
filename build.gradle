plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'org.knouauto'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Selenium
    implementation 'org.seleniumhq.selenium:selenium-java:4.23.1'
    implementation 'org.seleniumhq.selenium:selenium-devtools-v126:4.23.0'

    // WebDriverManager
    implementation('io.github.bonigarcia:webdrivermanager:5.9.1') {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
    }

    // Jackson Databind 특정 버전 추가
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'

    // 자동 로그인 비밀번호를 OS 자격 증명 저장소(Windows 자격 증명 관리자 / macOS 키체인)에 보관
    implementation 'com.github.javakeyring:java-keyring:1.0.4'
}

test {
    useJUnitPlatform()
}

// ShadowJar 설정
shadowJar {
    archiveBaseName.set('knou-auto-player')
    archiveClassifier.set('fat')
    archiveVersion.set('1.0.5')
    manifest {
        attributes 'Main-Class': 'org.knouauto.GUI'
    }
}

// jpackage 패키징 (크로스 빌드가 안 되므로 각 OS에서만 실행 가능)
def jpackageInputDir = layout.buildDirectory.dir('jpackage/input')
def jpackageOutputDir = layout.buildDirectory.dir('jpackage/dist')
def osName = System.getProperty('os.name').toLowerCase()
def jpackageExecutable = "${System.getProperty('java.home')}/bin/jpackage" + (osName.contains('windows') ? '.exe' : '')

// jpackage는 --input 폴더의 모든 jar를 앱에 포함하므로 fat jar 하나만 복사
tasks.register('prepareJpackageInput', Sync) {
    from shadowJar
    into jpackageInputDir
}

// OS별 jpackage 태스크 공통 등록
// osLabel: 설명용 OS 이름, osKeyword: os.name에 포함돼야 하는 문자열, type: jpackage --type
def registerJpackageTask = { String taskName, String osLabel, String osKeyword, String type, String iconPath, List<String> extraArgs ->
    tasks.register(taskName, Exec) {
        group = 'distribution'
        description = "${osLabel}용 .${type} 파일을 생성합니다. (${osLabel}에서만 실행 가능)"
        dependsOn 'prepareJpackageInput'

        doFirst {
            if (!osName.contains(osKeyword)) {
                throw new GradleException("${taskName}은 ${osLabel}에서만 실행할 수 있습니다.")
            }
            project.delete(jpackageOutputDir)
        }

        executable jpackageExecutable
        args(['--type', type,
              '--name', 'KNOU Auto Player',
              '--app-version', shadowJar.archiveVersion.get(),
              '--input', jpackageInputDir.get().asFile.path,
              '--main-jar', shadowJar.archiveFileName.get(),
              '--main-class', 'org.knouauto.GUI',
              '--icon', file(iconPath).path,
              '--dest', jpackageOutputDir.get().asFile.path] + extraArgs)
    }
}

// macOS용 .dmg
registerJpackageTask('packageMac', 'macOS', 'mac', 'dmg', 'packaging/macos/icon.icns', [
        '--mac-package-identifier', 'org.knouauto.player',
])

// Windows용 .msi (WiX Toolset 3.x 필요)
// --win-upgrade-uuid는 같은 앱으로 인식돼 덮어쓰기 설치가 되도록 고정값 사용 (바꾸지 말 것)
registerJpackageTask('packageWindows', 'Windows', 'windows', 'msi', 'packaging/windows/icon.ico', [
        '--win-menu',
        '--win-shortcut',
        '--win-dir-chooser',
        '--win-upgrade-uuid', 'a3c6f1e2-7b84-4d2e-9c5a-1f0e8d7b6a21',
])
