name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon (M1 이후)
            arch: arm64
          - runner: macos-15-intel  # Intel Mac
            arch: x64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build dmg
        run: ./gradlew packageMac --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: knou-auto-player-macos-${{ matrix.arch }}
          path: build/jpackage/dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # jpackage --type msi 는 WiX Toolset 3.x(candle.exe, light.exe)가 PATH에 있어야 함
      # 러너 이미지에 기본 설치돼 있지만, 없으면 설치
      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          (Get-Command candle.exe).Source

      - name: Build msi
        run: ./gradlew packageWindows --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: knou-auto-player-windows-x64
          path: build/jpackage/dist/*.msi
          if-no-files-found: error

  # v* 태그 push일 때만: 빌드된 설치 파일 이름을 릴리즈 규칙(KNOUAuto-x.x.x*)으로 바꿔 draft 릴리즈에 첨부
  # 릴리즈 노트는 draft에서 직접 작성한 뒤 공개
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Rename files
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          cp dist/knou-auto-player-windows-x64/*.msi "release/KNOUAuto-${version}.msi"
          cp dist/knou-auto-player-macos-arm64/*.dmg "release/KNOUAuto-${version}-macos-arm64.dmg"
          cp dist/knou-auto-player-macos-x64/*.dmg "release/KNOUAuto-${version}-macos-x64.dmg"
          ls -l release

      # 같은 태그의 릴리즈가 이미 있으면(재실행 등) 파일만 덮어쓰기
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --draft --title "$GITHUB_REF_NAME" --notes ""
          fi
